# Site settings (content itself comes from the xrcare-backend API: GET /api/site)
title: XRCare AI
description: XR-AI Care Co-Pilot. Delivering the power of XR + AI to healthcare.

# "" locally; the GitHub Pages build passes the real path (/xrcare-frontend) with --baseurl (see .github/workflows)
baseurl: ""

# Every page uses _layouts/default.html (shared header, footer and scripts) unless it sets its own layout
defaults:
  - scope:
      path: ""
    values:
      layout: default

# All styling is Sass: assets/css/main.scss pulls in the partials in _sass/
sass:
  sass_dir: _sass
  style: compressed

# Files Jekyll should not copy into the site (same approach as Open Coding Society pages)
exclude:
# Jekyll defaults
  - vendor
  - Gemfile
  - Gemfile.lock
# Custom excludes
  - Makefile
  - README.md
  - tools
