- slug: nurse-copilot
  name: Meet the Nurse Co-Pilot
  layout: product
  theme: dark
  content:
    eyebrow: MEET XRCare
    heading: A spatial AI co-pilot, worn as smart glasses.
    text: >-
      XRCare helps nurses stay focused on the patient and the task. The glasses see the device and the nurse’s hands,
      hear their workflow, then match what is happening to the order and protocol. When something doesn’t match,
      XRCare can quietly guide the next step. The nurse stays in control.
    image: /images/spatial-ai-product.png
    image_alt: XRCare smart glasses shown with its care workflow interface
    steps:
    - title: See
      text: Watches the nurse’s hands, device and settings from their point of view.
    - title: Hear
      text: Listens as the nurse talks through each step of the workflow.
    - title: Understand
      text: Matches what is happening to the patient, order and protocol for context-aware guidance.
    - title: Assist
      text: Quietly flags a mismatch and guides the next step. Expert Assist can bring a colleague into the view live.
    note: Spatial AI runs on the device, designed for fast, private guidance—even where the network is limited.
    link:
      label: Meet the XRCare product
      url: https://xrcare.ai/
- slug: co-pilot
  name: The Co-Pilot
  layout: copilot
  theme: dark
  content:
    text: >-
      Most healthcare AI reads charts or listens to conversations. XRCare Spatial AI understands the physical work of care:
      what is in front of the nurse, what their hands are doing, and what should happen next. It brings together vision,
      speech and workflow context to support the moment of care. <strong>The AI suggests; the nurse decides.</strong>
    core_label: Spatial AI
    inputs:
    - icon: fa-solid fa-eye
      label: Vision
    - icon: fa-solid fa-microphone-lines
      label: Speech
    - icon: fa-solid fa-list-check
      label: Workflow
    - icon: fa-solid fa-file-medical
      label: EMR
- slug: features
  name: Agentic AI Features
  layout: capabilities
  theme: dark
  content:
    heading: Built around the way nurses work
    items:
    - icon: fa-solid fa-eye
      title: Context-Aware Intelligence
      image: /images/capabilities/context-aware.jpg
      image_alt: Clinician wearing XRCare glasses working with a holographic interface
      text: Knows the patient, order and protocol so guidance fits the care moment.
    - icon: fa-solid fa-wand-magic-sparkles
      title: Proactive Co-Pilot
      image: /images/capabilities/proactive-copilot.jpg
      image_alt: Pharmacist wearing XRCare glasses, guided at work with a tablet
      text: Spots a mismatch and guides the next step before it goes further.
    - icon: fa-solid fa-layer-group
      title: Multimodal Insight
      image: /images/capabilities/multimodal.jpg
      image_alt: XRCare smart glasses with cameras and a sensor ring
      text: Brings together what the glasses see, hear and read into one picture of the care in progress.
    - icon: fa-solid fa-diagram-project
      title: Adaptive Orchestration
      image: /images/capabilities/orchestration.jpg
      image_alt: XRCare Spatial AI glasses over the procedure and workflow dashboard
      text: Adjusts guidance to each procedure, device and nurse, step by step.
    - icon: fa-solid fa-arrows-rotate
      title: Human in the Loop
      image: /images/capabilities/human-in-the-loop.jpg
      image_alt: Confident nurse in the hospital
      text: The system offers context and suggestions; the nurse remains in control of each decision.
    - icon: fa-solid fa-shield-halved
      title: Privacy-First Design
      image: /images/capabilities/privacy-first.jpg
      image_alt: Close-up of the cameras built into the XRCare glasses
      text: Runs on the device with clear consent, designed to keep patient video in the room.
- slug: Avoid-Burnout
  name: Modern Solutions
  layout: pillars
  theme: light
  content:
    heading_accent: 'From practice'
    heading: to the point of care
    items:
    - icon: fa-solid fa-gauge-high
      title: Prepare safely
      text: >-
        XR simulations let clinicians rehearse procedures and care scenarios before applying skills with patients.
        Real-time AI support for routine tasks can help teams stay focused on care.
    - icon: fa-solid fa-vr-cardboard
      title: Build consistency
      text: >-
        Lifelike XR scenarios and AI-driven modules support consistent standards across teams, sites and staff levels,
        with personalized coaching for critical situations.
    - icon: fa-solid fa-brain
      title: Keep improving
      text: >-
        Performance insights can reveal skill gaps and guide personalized development over time, while AI support
        helps surface risks during care workflows.
