title: Explore
sections:
- slug: top
  name: Explore
  layout: pagehead
  theme: dark
  content:
    title: Explore XRCare
    highlight: XRCare
    text: >-
      Explore XRCare’s smart-glasses nurse co-pilot and Spatial AI, along with XR clinical training and pharmacy
      workflow solutions.
- slug: jump
  name: ''
  layout: subnav
  theme: dark
  content:
