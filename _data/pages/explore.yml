- slug: clinical-teams
  name: Clinical Teams
  layout: audience
  theme: dark
  content:
    title: For Clinical Teams
    heading: More patient time. Less admin.
    text: >-
      XRCare supports frontline teams with point-of-care guidance, interactive XR training, and AI-assisted charting,
      coding and reporting—helping reduce administrative work and make more time for patient care.
    image: /images/clinical-teams.jpg
    features:
    - icon: fa-solid fa-graduation-cap
      title: Point-of-Care Guidance
      text: Context-aware support brings relevant information into the care workflow.
    - icon: fa-solid fa-heart-pulse
      title: More Time for Patients
      text: Streamline routine workflows so clinical teams can focus on bedside care.
    - icon: fa-solid fa-file-medical
      title: Reduce Administrative Burden
      text: AI-assisted charting, coding, and reporting free nurses for patient care.
    cta:
      label: Talk to Our Team
      url: /contact/
- slug: care-team-training
  name: Care Team Training
  layout: audience
  theme: dark
  content:
    title: For Care Team Training
    heading: Build confidence before care begins.
    text: >-
      Practice procedures safely in lifelike XR scenarios, strengthen teamwork, and use AI feedback to guide
      continued learning before applying skills to patient care.
    image: /images/care-team-training.jpg
    reverse: true
    features:
    - icon: fa-solid fa-people-arrows
      title: Collaborative Learning
      text: XR team scenarios improve coordination and reduce errors in handoffs.
    - icon: fa-solid fa-scale-balanced
      title: Consistent Standards
      text: AI modules ensure training consistency across sites and staff levels.
    - icon: fa-solid fa-chart-line
      title: Continuous Improvement
      text: Analytics reveal gaps and guide personalized skill development.
    cta:
      label: Talk to Our Team
      url: /contact/
- slug: pharmacy
  name: Pharmacy
  layout: audience
  theme: dark
  content:
    title: For Pharmacy
    heading: Delivering the Power of XR + AI to Pharmacy
    text: >-
      XRCare Pharmacy delivers XR-AI workflow guidance through XR glasses and compatible devices, supporting pharmacists
      and technicians in day-to-day medication workflows.
    image: /images/pharmacy.jpg
    cta:
      label: Talk to Our Team
      url: /contact/
- slug: articles
  name: Articles
  layout: articles
  theme: dark
  content:
    heading: Ideas for the future of care
    text: Insights from the XRCare team on XR, AI and the future of care.
    search_placeholder: Search articles
    all_label: All topics
    read_more: Read article
    no_results: No articles match your search.
