---
body_class: is-flow
header: transparent
scripts:
  - /js/article.js
---
<!-- One article: /articles/post/?slug=<slug>, from GET /api/articles/<slug> -->
<article class="article-page">
  <header class="article-hero">
    <div class="article-hero__image" data-article-image aria-hidden="true"></div>
    <div class="article-hero__shade" aria-hidden="true"></div>
    <div class="container article-hero__inner">
      <p class="breadcrumbs" data-breadcrumbs></p>
      <h1 class="article-hero__title" data-article-title></h1>
      <p class="article-hero__meta" data-article-meta></p>
    </div>
  </header>
  <div class="container">
    <div class="article-body" data-article></div>
  </div>
  <nav class="container post-nav" data-post-nav aria-label="More articles"></nav>
  <div class="share-button" data-share hidden>
    <button type="button" class="share-button__toggle" aria-expanded="false"><i class="fa-solid fa-share-nodes" aria-hidden="true"></i><span class="sr-only" data-site-text="blog.share"></span></button>
    <a class="share-button__link" target="_blank" rel="noopener"><i class="fa-brands fa-linkedin" aria-hidden="true"></i> <span data-site-text="blog.share"></span></a>
  </div>
</article>
